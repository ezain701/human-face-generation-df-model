seed: 42
dataset:
  name: butterflies
  image_size: 128
  batch_size: 16
  num_workers: 2

model:
  in_channels: 3
  base_channels: 64
  channel_mults: [1, 2, 4]
  time_emb_dim: 256

diffusion:
  timesteps: 300
  beta_schedule: linear

train:
  epochs: 10
  lr: 0.0002
  grad_clip: 1.0
  device: cuda
  save_every: 1
  output_name: butterfly

sample:
  num_images: 16
